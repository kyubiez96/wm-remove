name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: wm-remove-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build and push image to GHCR
        run: |
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/kyubiez96/wm-remove:latest

      - name: Make GHCR image public
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/user/packages/container/wm-remove/visibility" \
            -d '{"visibility":"public"}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Render deploy
        run: |
          curl -fsS -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?ownerId=${RENDER_OWNER_ID}" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Content-Type: application/json" -d '{}'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_OWNER_ID: tea-dajkqelg1s2s73b4v3s0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy gate Worker
        working-directory: worker
        run: npx -y wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Worker secrets
        working-directory: worker
        run: |
          for pair in \
            "SITE_PASSWORD=$SITE_PASSWORD" \
            "COOKIE_SECRET=$COOKIE_SECRET" \
            "SPACE_URL=$SPACE_URL" \
            "SPACE_KEY=$SPACE_KEY"; do
            key="${pair%%=*}"; val="${pair#*=}"
            printf '%s' "$val" | npx -y wrangler@4 secret put "$key"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_PASSWORD: ${{ secrets.WM_SITE_PASSWORD }}
          COOKIE_SECRET: ${{ secrets.WM_COOKIE_SECRET }}
          SPACE_URL: ${{ secrets.WM_SPACE_URL }}
          SPACE_KEY: ${{ secrets.WM_SPACE_KEY }}

      - name: Smoke test behind gate
        run: |
          for i in $(seq 1 6); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 15 -c /tmp/cj https://eksi.biz.id/wm-remove/)
            if [ "$code" = "200" ]; then
              # login page served (not authed) — good enough route check
              echo "gate route OK"; exit 0
            fi
            sleep 10
          done
          echo "::error::wm-remove route not serving"; exit 1
